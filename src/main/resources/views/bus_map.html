<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Carte Bus</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            touch-action: auto;
        }
        .leaflet-container {
            background: #fff;
            outline: 0;
        }
        .bus-label {
            font-weight: bold;
            font-size: 12px;
            text-shadow: -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff;
            pointer-events: none;
        }
        .bus-stop-icon {
            background: #ff7800;
            border-radius: 50%;
            border: 2px solid #fff;
            width: 12px;
            height: 12px;
        }
    </style>
</head>
<body>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
<script>
    let map;
    const busLines = [];
    const busStops = {};
    let isInitialized = false;

    function initMap() {
        if (!isInitialized) {
            map = L.map('map', {
                preferCanvas: true,
                zoomControl: true,
                tap: false
            }).setView([36.8, 10.18], 10);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap',
                maxZoom: 18,
                minZoom: 8
            }).addTo(map);

            map.touchZoom.enable();
            map.doubleClickZoom.enable();
            map.scrollWheelZoom.enable();

            isInitialized = true;
            console.log('Bus map initialized with zoom controls');
        }
    }

    window.addBusLine = function(departure, lat1, lng1, destination, lat2, lng2) {
        if (!isInitialized) initMap();

        addBusStop(departure, lat1, lng1);
        addBusStop(destination, lat2, lng2);

        const line = L.polyline([[lat1, lng1], [lat2, lng2]], {
            color: '#ff7800',
            weight: 4,
            opacity: 0.8,
            dashArray: '8, 6'
        }).addTo(map);

        const midPoint = [(lat1 + lat2) / 2, (lng1 + lng2) / 2];
        L.marker(midPoint, {
            icon: L.divIcon({
                className: 'bus-label',
                html: `${departure} → ${destination}`,
                iconSize: null
            }),
            interactive: false
        }).addTo(map);

        line.bindPopup(`
                <div style="text-align:center;min-width:150px">
                    <h4 style="margin:5px 0;color:#ff7800">Ligne Bus</h4>
                    <div style="display:flex;justify-content:center">
                        <span style="font-weight:bold">${departure}</span>
                        <span style="margin:0 5px">→</span>
                        <span style="font-weight:bold">${destination}</span>
                    </div>
                </div>
            `);

        busLines.push(line);
        fitMapToBounds();
    };

    function addBusStop(city, lat, lng) {
        if (!busStops[city]) {
            busStops[city] = L.marker([lat, lng], {
                icon: L.divIcon({
                    className: 'bus-stop-icon',
                    iconSize: [16, 16]
                })
            }).addTo(map)
                .bindPopup(`<div style="text-align:center"><b>${city}</b><br>Arrêt Bus</div>`);
        }
    }

    function fitMapToBounds() {
        const group = L.featureGroup([...busLines, ...Object.values(busStops)]);
        map.fitBounds(group.getBounds().pad(0.1));
    }

    // Initialisation différée pour meilleures performances
    setTimeout(initMap, 100);
</script>
</body>
</html>
