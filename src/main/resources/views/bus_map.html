<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <title>Carte Bus</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css"/>
    <style> html,body,#map{width:100%;height:100%;margin:0;padding:0;} </style>
</head>
<body>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
<script>
    window.map = null;
    let busLines = [], busStops = {}, isInitialized = false;

    function initMap() {
        if (isInitialized) return;
        window.map = L.map('map').setView([36.8,10.18],10);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OSM'}).addTo(window.map);
        isInitialized = true;
        console.log('Map ready');
    }

    window.addBusLine = function(dep, lat1, lng1, dest, lat2, lng2) {
        if (!isInitialized) initMap();
        // … votre code d’ajout de ligne et d’arrêt …
        fitMapToBounds();
    };

    function fitMapToBounds() {
        const group = L.featureGroup([...busLines, ...Object.values(busStops)]);
        window.map.fitBounds(group.getBounds().pad(0.1));
    }
</script>
</body>
</html>
